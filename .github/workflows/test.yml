name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        node-version: ["20", "22", "24"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Version
        run: |
          python -m myna --version
          node --version

      - name: Test
        run: python -m unittest discover -s tests -v

  # Single stable status check for branch protection: the matrix job names
  # change whenever the version lists change.
  ci-success:
    needs: test
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify every matrix job passed
        if: ${{ needs.test.result != 'success' }}
        run: |
          echo "Matrix result: ${{ needs.test.result }}"
          exit 1
