[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "myna-lang"
version = "0.3.0"
description = "Myna: An AI-friendly, token-efficient symbolic language that transpiles to/from Python and JavaScript"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = []

[project.scripts]
myna = "myna.cli:main"

[tool.setuptools]
packages = ["myna", "myna.backends", "myna.frontends"]
