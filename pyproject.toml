[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "myna-lang"
version = "0.4.0"
description = "Myna: An AI-friendly, token-efficient symbolic language that transpiles to/from Python and JavaScript"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []
authors = [{ name = "Joseph Hicks" }]
keywords = ["language", "transpiler", "compiler", "python", "javascript", "llm", "code-generation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Compilers",
]

[project.urls]
Homepage = "https://github.com/jhicksdev/myna"
Repository = "https://github.com/jhicksdev/myna"
Issues = "https://github.com/jhicksdev/myna/issues"
Changelog = "https://github.com/jhicksdev/myna/blob/main/CHANGELOG.md"

[project.scripts]
myna = "myna.cli:main"

[tool.setuptools]
packages = ["myna", "myna.backends", "myna.frontends"]
